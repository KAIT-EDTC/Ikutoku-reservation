name: Preview

# PRごとに、そのPRのコードで動くプレビュー環境を作る（PRを閉じたら消す）
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: f63f9ebc5db7b049a6e98a155a3d219d
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # fork と Dependabot のPRには secret が渡らないので作らない（pull_request_target は使わない）
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # D1 は全PRで共有しているので、別のPRのデプロイ（D1の作り直し）と同時に走らせない
    concurrency:
      group: preview-d1
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - id: url
        name: Resolve preview URL
        # アカウントの workers.dev サブドメインはAPIで引く（URLを設定ファイルに書かずに済む）
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -er .result.subdomain)
          echo "url=https://$PREVIEW_NAME-ikutoku-reservation-preview.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      # PRの途中でマイグレーションが書き換わることがあるので、毎回まっさらにする。
      # 全PRでD1を共有しているため、最後にデプロイしたPRのデータが残る。
      - name: Reset D1
        working-directory: server
        run: |
          tables=$(npx wrangler d1 execute DB --remote --env preview --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" | jq -r '(.[0] // {}).results // [] | .[] | .name')
          if [ -n "$tables" ]; then
            sql="PRAGMA defer_foreign_keys = on;"
            while IFS= read -r t; do
              sql="$sql DROP TABLE IF EXISTS \"$t\";"
            done <<< "$tables"
            npx wrangler d1 execute DB --remote --env preview --command "$sql"
          fi
          npx wrangler d1 migrations apply DB --remote --env preview
          npx wrangler d1 execute DB --remote --env preview --file seed/seed.sql

      # 管理者はプレビュー用の秘密鍵（npm run setup-otp -- --preview で発行）で入れる。
      # リポジトリが公開なので、鍵はリポジトリやログに出さず secret から渡す
      - name: Add admin
        working-directory: server
        env:
          PREVIEW_TOTP_SECRET: ${{ secrets.PREVIEW_TOTP_SECRET }}
        run: |
          if [[ ! "$PREVIEW_TOTP_SECRET" =~ ^[A-Z2-7]+$ ]]; then
            echo "::warning::PREVIEW_TOTP_SECRET が未登録か形式が違うので、管理画面にはログインできません"
            exit 0
          fi
          npx wrangler d1 execute DB --remote --env preview --command "INSERT INTO admins (login_id, totp_secret) VALUES ('admin', '$PREVIEW_TOTP_SECRET') ON CONFLICT (login_id) DO UPDATE SET totp_secret = excluded.totp_secret, totp_last_step = 0"

      - name: Deploy Preview
        working-directory: server
        run: |
          npx wrangler preview --env preview --name "$PREVIEW_NAME" \
            --var "FRONTEND_URL:${{ steps.url.outputs.url }}"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 共有のD1は削除しない（IDが変わると他のPRのプレビューが壊れるため）
      - name: Delete Preview
        working-directory: server
        run: |
          npx wrangler preview delete --env preview --name "$PREVIEW_NAME" -y
